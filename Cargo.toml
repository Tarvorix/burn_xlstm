[package]
name = "burn-xlstm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Stabilized sLSTM, mLSTM, and residual xLSTM networks for Burn"
license = "Apache-2.0"
repository = "https://github.com/Tarvorix/burn_xlstm"
readme = "README.md"
keywords = ["burn", "xlstm", "lstm", "deep-learning", "neural-network"]
categories = ["science"]

[features]
default = ["flex"]
flex = ["burn/flex"]
wgpu = ["burn/wgpu"]

[dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std", "optim"] }

[dev-dependencies]
serde_json = "1"

# Recommended lint configuration from M-STATIC-VERIFICATION.
# Source: https://microsoft.github.io/rust-guidelines/guidelines/universal/#M-STATIC-VERIFICATION
# Copyright (c) Microsoft Corporation. Licensed under the MIT license.
#
# Put these blocks in the WORKSPACE Cargo.toml, then have each member inherit:
#
#     [lints]
#     workspace = true
#
# (M-CARGO-WORKSPACE: shared settings live in the workspace root, not duplicated per crate.)

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives

# Additional lints are from the `restriction` and `nursery` group that prevent specific
# constructs being used in source code in order to drive up consistency,
# quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"

# Define custom opt outs here
# Burn's optional backends require several incompatible transitive versions.
multiple_crate_versions = "allow"

[[example]]
name = "delayed_copy"
required-features = ["flex"]
